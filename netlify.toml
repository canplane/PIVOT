[build]
  # SWF_PATH is read out of index.html's own `const swfPath = "..."` rather
  # than duplicated here — editing index.html to point at a different build
  # is enough on its own, nothing else needs to change in step.
  command = "SWF_PATH=$(grep -oE 'swfPath = \"[^\"]+\"' index.html | sed -E 's/swfPath = \"([^\"]+)\"/\\1/') && mkdir -p \"dist/$(dirname \"$SWF_PATH\")\" dist/fonts && cp index.html dist/ && cp \"$SWF_PATH\" \"dist/$SWF_PATH\" && cp fonts/pretendard.swf dist/fonts/"
  publish = "dist"
